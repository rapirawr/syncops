<!DOCTYPE html>
<html lang="id" class="h-full bg-zinc-950 text-zinc-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | SyncOps</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center bg-zinc-950 font-sans p-6 text-zinc-100">
    <div class="max-w-md w-full text-center space-y-6 bg-zinc-900/60 border border-white/10 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">
        <div class="mx-auto w-16 h-16 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-12.728 0a9 9 0 010-12.728m12.728 0L5.636 18.364M12 12h.01" />
            </svg>
        </div>
        <div class="space-y-2">
            <h1 class="text-xl font-bold text-white tracking-wide">Koneksi Terputus</h1>
            <p class="text-xs text-zinc-400 leading-relaxed">
                SyncOps tidak dapat terhubung ke jaringan. Periksa koneksi internet Anda dan coba muat ulang halaman.
            </p>
        </div>
        <div>
            <button onclick="window.location.reload()" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                Coba Lagi
            </button>
        </div>
    </div>
</body>
</html>
